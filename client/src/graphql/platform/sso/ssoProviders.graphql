query ssoProviders {
    ssoProviders {
        id
        name
        type
        vendor
        enabled
        domains
        enforceSso
        autoProvision
        defaultAuthority
        registrationId
        loginPath
        callbackPath
        serviceProviderMetadataPath
        issuerUri
        clientId
        clientSecretSet
        scopes
        metadataUrl
        metadataXml
    }
}
